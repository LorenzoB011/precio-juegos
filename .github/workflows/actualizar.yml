name: Actualizar precios

on:
  schedule:
    - cron: "0 12 * * *"   # todos los días a las 9:00 de Argentina
  workflow_dispatch:        # botón para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python precios_juegos.py
      - run: |
          git config user.name "bot-precios"
          git config user.email "bot-precios@users.noreply.github.com"
          git add index.html
          git commit -m "Precios actualizados" || echo "Sin cambios"
          git push
